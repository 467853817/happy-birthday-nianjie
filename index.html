<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fff0f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>生日快乐 · Happy Birthday</title>

<!--
  ═══════════════════════════════════════════════════════════════
   生日快乐 · 生日祝福网站（单文件版）
   —— 你只需要修改下面【配置区】里的内容 + 把照片/音乐放进文件夹
  ═══════════════════════════════════════════════════════════════
-->

<style>
/* ═══════════════════════════════════════════════════════════
   1. 设计 Token（马卡龙色系 · 清新风）
   ═══════════════════════════════════════════════════════════ */
:root{
  /* 主色：马卡龙粉 */
  --pink-50:#fff5f9;  --pink-100:#ffe4ef;  --pink-200:#ffc9de;
  --pink-300:#ffa8c9;  --pink-400:#ff86b3;  --pink-500:#ff6aa0;
  --pink-600:#f04d87;  --pink-700:#d13a70;

  /* 辅助色：马卡龙薄荷 / 鹅黄 / 淡紫 / 天蓝 */
  --mint-100:#ddfaf1;  --mint-300:#a8eed8;  --mint-500:#6fd9bb;
  --lemon-100:#fff9d6; --lemon-300:#ffe896; --lemon-500:#ffd75e;
  --lilac-100:#f0e8ff; --lilac-300:#d4c2ff; --lilac-500:#b79bff;
  --sky-100:#e0f2ff;   --sky-300:#a9d9ff;   --sky-500:#6fb8ff;

  /* 中性色 */
  --ink-900:#3b2b38;   --ink-700:#5c4756;   --ink-500:#8a7386;
  --ink-300:#b9a6b3;   --line:#f2e4ec;      --white:#ffffff;

  /* 语义 */
  --success:#4ecb9a;   --danger:#ff6b81;

  /* 间距 · 8px 基线 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;

  /* 字号刻度 */
  --fs-xs:12px; --fs-sm:14px; --fs-base:16px; --fs-lg:18px;
  --fs-xl:22px; --fs-2xl:28px; --fs-3xl:34px; --fs-4xl:44px;

  /* 圆角 / 阴影 */
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:32px; --r-full:999px;
  --sh-1:0 2px 8px rgba(255,106,160,.12);
  --sh-2:0 8px 28px rgba(255,106,160,.18);
  --sh-3:0 16px 48px rgba(180,120,160,.22);

  /* 动效 */
  --ease:cubic-bezier(.22,.61,.36,1);
  --dur:.26s;

  /* iPhone 安全区 */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

/* ═══════════════════════════════════════════════════════════
   2. 基础重置
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:var(--fs-base); line-height:1.65; color:var(--ink-700);
  background:linear-gradient(160deg,#fff5f9 0%,#f0e8ff 40%,#e0f2ff 75%,#ddfaf1 100%);
  background-attachment:fixed;
  min-height:100vh; min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 装饰性背景图：缩小、不铺满，居中横幅展示 */
.bg-photo{
  position:fixed;
  top:38%; left:50%;
  width:min(86vw, 640px);
  height:auto;
  max-height:36vh;
  object-fit:cover;
  object-position:center 30%;
  transform:translate(-50%, -50%);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-3);
  z-index:0;
  pointer-events:none;
  opacity:.88;
}
@media (min-width:768px){
  .bg-photo{width:min(58vw, 560px); max-height:42vh; top:36%;}
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--pink-500);outline-offset:3px;border-radius:var(--r-sm)}

/* ═══════════════════════════════════════════════════════════
   3. 背景层：星空粒子 + 流星 + 柔光球
   ═══════════════════════════════════════════════════════════ */
#sky{display:none}
.blob{display:none}

/* ═══════════════════════════════════════════════════════════
   4. 通用容器与卡片
   ═══════════════════════════════════════════════════════════ */
.wrap{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:0 var(--sp-5)}
section{padding:var(--sp-10) 0}
.sec-title{
  font-size:var(--fs-2xl);font-weight:800;color:var(--ink-900);
  text-align:center;margin-bottom:var(--sp-2);letter-spacing:.5px
}
.sec-sub{text-align:center;color:var(--ink-500);font-size:var(--fs-sm);margin-bottom:var(--sp-6)}

.card{
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:var(--r-lg);box-shadow:var(--sh-2);
  padding:var(--sp-6);
}

/* ═══════════════════════════════════════════════════════════
   5. 首屏：生日祝福 + 倒计时
   ═══════════════════════════════════════════════════════════ */
#hero{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding-top:calc(var(--safe-t) + var(--sp-8));
  padding-bottom:calc(var(--safe-b) + var(--sp-8));position:relative
}
.hero-emoji{font-size:64px;line-height:1;animation:bounce 2.4s var(--ease) infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}

.hero-name{
  font-size:var(--fs-4xl);font-weight:900;margin:var(--sp-4) 0 0;line-height:1.15;
  background:linear-gradient(120deg,var(--pink-500),var(--lilac-500) 50%,var(--sky-500));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:1px
}
.hero-line{font-size:var(--fs-lg);color:var(--ink-700);margin-top:var(--sp-3);font-weight:600}
.hero-desc{color:var(--ink-500);font-size:var(--fs-sm);margin-top:var(--sp-2);max-width:20em}

/* 倒计时 */
.countdown{display:flex;gap:var(--sp-2);justify-content:center;margin-top:var(--sp-6);flex-wrap:wrap}
.cd-box{
  min-width:64px;padding:var(--sp-3) var(--sp-2);
  background:rgba(255,255,255,.9);border-radius:var(--r-md);
  box-shadow:var(--sh-1);border:1px solid var(--pink-100)
}
.cd-num{font-size:var(--fs-2xl);font-weight:900;color:var(--pink-600);font-variant-numeric:tabular-nums;line-height:1.1}
.cd-lab{font-size:var(--fs-xs);color:var(--ink-500);margin-top:2px}
.cd-today{margin-top:var(--sp-5);font-size:var(--fs-lg);font-weight:800;color:var(--pink-600);
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.85}}

/* 滚动提示 */
.scroll-hint{
  position:absolute;bottom:calc(var(--safe-b) + var(--sp-5));left:50%;transform:translateX(-50%);
  font-size:var(--fs-xs);color:var(--ink-500);display:flex;flex-direction:column;align-items:center;gap:6px
}
.scroll-hint span{width:22px;height:34px;border:2px solid var(--ink-300);border-radius:var(--r-full);position:relative}
.scroll-hint span::after{content:"";position:absolute;top:6px;left:50%;width:4px;height:7px;margin-left:-2px;
  background:var(--pink-400);border-radius:2px;animation:scrollDot 1.6s var(--ease) infinite}
@keyframes scrollDot{0%{transform:translateY(0);opacity:1}70%{transform:translateY(12px);opacity:0}100%{opacity:0}}

/* ═══════════════════════════════════════════════════════════
   6. 按钮
   ═══════════════════════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  min-height:48px;padding:var(--sp-3) var(--sp-6);
  font-size:var(--fs-base);font-weight:700;border-radius:var(--r-full);
  background:linear-gradient(120deg,var(--pink-500),var(--lilac-500));
  color:#fff;box-shadow:var(--sh-2);
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
  will-change:transform;user-select:none
}
.btn:hover{transform:scale(1.05);box-shadow:var(--sh-3)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(255,255,255,.9);color:var(--pink-600);border:2px solid var(--pink-200)}
.btn.block{width:100%}

/* ═══════════════════════════════════════════════════════════
   7. 信（逐字显示）
   ═══════════════════════════════════════════════════════════ */
.letter{
  background:linear-gradient(180deg,#fffdf9,#fff7fb);
  border-radius:var(--r-lg);box-shadow:var(--sh-2);
  padding:var(--sp-6);border:1px solid var(--pink-100);position:relative;overflow:hidden
}
.letter::before{content:"";position:absolute;inset:0 0 auto;height:6px;
  background:linear-gradient(90deg,var(--pink-300),var(--lemon-300),var(--mint-300),var(--sky-300),var(--lilac-300))}
.letter-body{
  font-size:var(--fs-base);line-height:2.05;color:var(--ink-700);
  min-height:12em;white-space:pre-wrap;word-break:break-word
}
.caret{display:inline-block;width:2px;height:1.05em;vertical-align:-2px;
  background:var(--pink-500);animation:blink .8s step-end infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.letter-sign{margin-top:var(--sp-5);text-align:right;font-style:italic;color:var(--ink-500);font-size:var(--fs-sm)}
.letter-actions{margin-top:var(--sp-5);display:flex;gap:var(--sp-3);flex-wrap:wrap}

/* ═══════════════════════════════════════════════════════════
   8. 照片墙
   ═══════════════════════════════════════════════════════════ */
.gallery{
  display:grid;gap:var(--sp-3);
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr))
}
.ph{
  position:relative;aspect-ratio:1/1;border-radius:var(--r-md);overflow:hidden;
  background:linear-gradient(135deg,var(--pink-100),var(--lilac-100));
  box-shadow:var(--sh-1);cursor:pointer;
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
  will-change:transform
}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.ph:hover{transform:scale(1.05) rotate(-1deg);box-shadow:var(--sh-3)}
.ph:hover img{transform:scale(1.08)}
.ph:active{transform:scale(.97)}
/* 占位提示（未放入图片时显示） */
.ph .placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;color:var(--pink-600);font-size:var(--fs-xs);text-align:center;padding:var(--sp-3)
}
.ph .placeholder b{font-size:26px}
/* 照片墙里偶发的贴纸角标 */
.ph .tape{position:absolute;top:8px;right:-6px;font-size:20px;transform:rotate(12deg);filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}

/* ═══════════════════════════════════════════════════════════
   9. 礼物开箱
   ═══════════════════════════════════════════════════════════ */
.gift-stage{display:flex;flex-direction:column;align-items:center;gap:var(--sp-5);text-align:center}
.gift{
  width:160px;height:160px;position:relative;cursor:pointer;
  transition:transform var(--dur) var(--ease);will-change:transform
}
.gift:hover{transform:scale(1.06) rotate(-2deg)}
.gift:active{transform:scale(.94)}
.gift .box-body{
  position:absolute;bottom:0;left:10px;right:10px;height:104px;border-radius:var(--r-sm);
  background:linear-gradient(160deg,var(--pink-400),var(--pink-600));box-shadow:var(--sh-2)
}
.gift .box-lid{
  position:absolute;top:20px;left:0;right:0;height:44px;border-radius:var(--r-sm);
  background:linear-gradient(160deg,var(--pink-300),var(--pink-500));box-shadow:var(--sh-1);
  transform-origin:center bottom;transition:transform .5s var(--ease)
}
.gift .ribbon-v{position:absolute;left:50%;top:20px;bottom:0;width:22px;margin-left:-11px;
  background:linear-gradient(180deg,var(--lemon-300),var(--lemon-500));border-radius:4px;z-index:3}
.gift .ribbon-h{position:absolute;left:0;right:0;top:56px;height:22px;
  background:linear-gradient(90deg,var(--lemon-300),var(--lemon-500));z-index:3;border-radius:4px}
.gift .bow{
  position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:40px;z-index:4;
  transition:transform .5s var(--ease)
}
.gift.open .box-lid{transform:translateY(-90px) rotate(-16deg);opacity:0}
.gift.open .bow{transform:translateX(-50%) translateY(-100px) rotate(30deg);opacity:0}
.gift.open{animation:shake .4s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.gift-reveal{
  opacity:0;transform:translateY(16px) scale(.9);
  transition:opacity .5s var(--ease),transform .5s var(--ease);
  font-size:var(--fs-lg);font-weight:800;color:var(--ink-900);
  max-width:22em
}
.gift-reveal.show{opacity:1;transform:translateY(0) scale(1)}
.gift-hint{font-size:var(--fs-sm);color:var(--ink-500)}

/* ═══════════════════════════════════════════════════════════
   10. 小游戏：接住掉落的爱心
   ═══════════════════════════════════════════════════════════ */
.game-wrap{position:relative}
#gameCanvas{
  width:100%;height:min(58vh,420px);display:block;border-radius:var(--r-lg);
  background:linear-gradient(180deg,#fff8fc,#eef7ff);
  box-shadow:var(--sh-2);border:1px solid var(--pink-100);touch-action:none
}
.game-hud{
  display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);
  margin-bottom:var(--sp-3);font-weight:800;color:var(--ink-900);font-size:var(--fs-base)
}
.game-hud .score{color:var(--pink-600)}
.game-hud .best{color:var(--lilac-500);font-size:var(--fs-sm)}
.game-over{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--sp-4);background:rgba(255,255,255,.92);border-radius:var(--r-lg);backdrop-filter:blur(6px);text-align:center
}
.game-over.show{display:flex}

/* ═══════════════════════════════════════════════════════════
   11. 彩蛋 & Toast
   ═══════════════════════════════════════════════════════════ */
.egg-grid{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.egg{
  padding:var(--sp-5) var(--sp-3);border-radius:var(--r-md);text-align:center;
  background:rgba(255,255,255,.8);border:1px dashed var(--pink-200);box-shadow:var(--sh-1);
  transition:transform var(--dur) var(--ease),background var(--dur) var(--ease);will-change:transform
}
.egg:hover{transform:translateY(-4px) scale(1.03);background:#fff}
.egg:active{transform:scale(.95)}
.egg .ico{font-size:34px;display:block;margin-bottom:var(--sp-2)}
.egg .nm{font-size:var(--fs-sm);font-weight:700;color:var(--ink-900)}
.egg.found{border-style:solid;border-color:var(--mint-300);background:var(--mint-100)}

#toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translate(-50%,20px);
  z-index:80;max-width:88vw;padding:var(--sp-3) var(--sp-5);
  background:rgba(59,43,56,.92);color:#fff;font-size:var(--fs-sm);font-weight:600;
  border-radius:var(--r-full);box-shadow:var(--sh-3);pointer-events:none;
  opacity:0;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ═══════════════════════════════════════════════════════════
   12. 最终页 + 便签四叶草
   ═══════════════════════════════════════════════════════════ */
#finale{
  position:fixed;inset:0;z-index:70;display:none;flex-direction:column;
  align-items:center;justify-content:flex-start;text-align:center;
  padding:calc(var(--safe-t) + var(--sp-10)) var(--sp-6) var(--sp-8);
  background:rgba(255,245,249,.9);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#finale.show{display:flex;animation:fadeIn .6s var(--ease)}
#finale .finale-text{margin-top:6vh;position:relative;z-index:72}
#finale .finale-sub{position:relative;z-index:72;margin-top:var(--sp-3)}
#finale #finaleClose{
  position:relative;z-index:73;margin-top:auto;
  background:rgba(255,255,255,.92)!important;
  box-shadow:var(--sh-2);
}
.finale-text{
  font-size:clamp(28px,8vw,48px);font-weight:900;line-height:1.25;
  background:linear-gradient(120deg,var(--pink-500),var(--lilac-500) 55%,var(--sky-500));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.finale-text .nm{display:inline-block;animation:pop .5s var(--ease) backwards}
@keyframes pop{from{transform:scale(0) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.finale-sub{margin-top:var(--sp-5);font-size:var(--fs-lg);color:var(--ink-700);font-weight:600}
#clover-notes{
  position:absolute;left:0;right:0;bottom:18%;top:28%;
  z-index:71;pointer-events:none;
  overflow:visible;
}
.note-card{
  position:absolute;left:50%;top:50%;
  width:82px;height:54px;padding:6px 8px;
  font-size:11px;font-weight:700;line-height:1.25;color:var(--ink-900);
  border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.14);
  display:flex;align-items:center;justify-content:center;text-align:center;
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  will-change:transform,opacity;
  border:1px solid rgba(255,255,255,.7);
}
.note-card.show{
  opacity:1;
  animation:noteFly 1.15s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes noteFly{
  0%{transform:translate(-50%,-50%) scale(0) rotate(0deg);opacity:0}
  55%{opacity:1}
  100%{transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(var(--rot));opacity:1}
}

/* ═══════════════════════════════════════════════════════════
   13. 音乐按钮 + 模糊进入
   ═══════════════════════════════════════════════════════════ */
#musicBtn{
  position:fixed;top:calc(var(--safe-t) + 16px);right:16px;z-index:50;
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
  box-shadow:var(--sh-2);display:flex;align-items:center;justify-content:center;
  font-size:22px;transition:transform var(--dur) var(--ease);
}
#musicBtn.playing{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#musicBtn:active{transform:scale(.9)}

/* 模糊进入覆盖层 */
#intro-overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:rgba(30,20,28,0.28);
  transition:opacity 1.55s cubic-bezier(.22,.61,.36,1),visibility 1.55s;
}
#intro-overlay.hide{
  opacity:0;visibility:hidden;pointer-events:none;
}
#intro-btn{
  padding:18px 36px;border-radius:999px;
  background:rgba(255,255,255,0.14);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,182,193,0.45);
  color:#fff;font-size:16px;font-weight:700;
  box-shadow:0 8px 32px rgba(0,0,0,.18);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:transform .25s ease,background .25s;
}
#intro-btn .zh{font-size:17px}
#intro-btn .en{font-size:11px;opacity:.8;letter-spacing:1px}
#intro-btn:active{transform:scale(.96)}

body.intro-active #sky,
body.intro-active .blob,
body.intro-active .bg-photo,
body.intro-active #musicBtn,
body.intro-active #hero,
body.intro-active main,
body.intro-active footer,
body.intro-active #hearts,
body.intro-active #toast,
body.intro-active #lightbox,
body.intro-active #finale{
  filter:blur(16px);
  transition:filter 1.55s cubic-bezier(.22,.61,.36,1);
  pointer-events:none;
}
body:not(.intro-active) #sky,
body:not(.intro-active) .blob,
body:not(.intro-active) .bg-photo,
body:not(.intro-active) #musicBtn,
body:not(.intro-active) #hero,
body:not(.intro-active) main,
body:not(.intro-active) footer,
body:not(.intro-active) #hearts,
body:not(.intro-active) #toast,
body:not(.intro-active) #lightbox,
body:not(.intro-active) #finale{
  filter:blur(0);
  transition:filter 1.55s cubic-bezier(.22,.61,.36,1);
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  body.intro-active *{filter:none!important}
  #intro-overlay{transition:none}
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body class="intro-active">

<!-- 背景 -->
<div id="sky" aria-hidden="true"><canvas id="skyCanvas"></canvas></div>
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<div class="blob b3" aria-hidden="true"></div>
<img class="bg-photo" src="bg.jpg" alt="" aria-hidden="true">

<!-- 音乐按钮 -->
<button id="musicBtn" aria-label="播放/暂停背景音乐" aria-pressed="false">♪</button>

<main>
  <!-- 首屏 -->
  <section id="hero">
    <div class="hero-emoji">🎂</div>
    <h1 class="hero-name" id="heroName">念姐</h1>
    <p class="hero-line">生日快乐呀！</p>
    <p class="hero-desc">愿你被这世界温柔以待，每天都有小确幸</p>
    <div class="countdown" id="countdown"></div>
    <div class="scroll-hint" aria-hidden="true"><span></span>向下滑动</div>
  </section>

  <div class="wrap">
    <!-- 信 -->
    <section>
      <h2 class="sec-title">💌 一封信</h2>
      <p class="sec-sub">慢慢看，字字都是真心</p>
      <div class="letter card">
        <div class="letter-body" id="letterBody"></div>
        <div class="letter-sign">—— 爱你的朋友</div>
        <div class="letter-actions">
          <button class="btn" id="letterStart">开始朗读</button>
          <button class="btn ghost" id="letterAll">全部显示</button>
        </div>
      </div>
    </section>

    <!-- 照片墙 -->
    <section>
      <h2 class="sec-title">📷 我们的照片墙</h2>
      <p class="sec-sub">点开每一张，都是回不去的快乐时光</p>
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- 礼物 -->
    <section>
      <h2 class="sec-title">🎁 打开礼物</h2>
      <p class="sec-sub">点击盒子看看里面有什么</p>
      <div class="gift-stage">
        <div class="gift" id="gift" role="button" tabindex="0" aria-label="打开礼物">
          <div class="box-lid"></div>
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
          <div class="bow">🎀</div>
          <div class="box-body"></div>
        </div>
        <p class="gift-hint">点一下打开～</p>
        <p class="gift-reveal" id="giftReveal"></p>
      </div>
    </section>

    <!-- 小游戏 -->
    <section>
      <h2 class="sec-title">🎮 接住爱心</h2>
      <p class="sec-sub">左右滑动接住掉下来的爱心吧</p>
      <div class="game-wrap">
        <div class="game-hud">
          <span class="score">得分 <b id="score">0</b></span>
          <span class="best">最高 <b id="best">0</b></span>
        </div>
        <canvas id="gameCanvas" width="360" height="420"></canvas>
        <div class="game-over" id="gameOver">
          <p style="font-size:22px;font-weight:800">游戏结束</p>
          <p>本次得分 <b id="finalScore">0</b></p>
          <button class="btn" id="restart">再玩一次</button>
        </div>
      </div>
    </section>

    <!-- 彩蛋 -->
    <section>
      <h2 class="sec-title">🥚 隐藏彩蛋</h2>
      <p class="sec-sub">找到全部彩蛋解锁最终惊喜（已找到 <b id="eggCount">0</b>）</p>
      <div class="egg-grid" id="eggGrid"></div>
    </section>

    <!-- 最终按钮 -->
    <section style="text-align:center;padding-bottom:var(--sp-12)">
      <button class="btn" id="finaleBtn" style="min-width:200px">点我！</button>
    </section>
  </div>
</main>

<footer style="text-align:center;padding:var(--sp-8) var(--sp-5);color:var(--ink-500);font-size:var(--fs-sm)">
  Made with 💕 for 念姐 · 2026.10.12
</footer>

<!-- 爱心飘浮容器 -->
<div id="hearts" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:60"></div>

<!-- 灯箱 -->
<div id="lightbox" style="position:fixed;inset:0;z-index:65;display:none;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:20px">
  <button id="lbClose" aria-label="关闭预览" style="position:absolute;top:20px;right:20px;color:#fff;font-size:32px">×</button>
  <img id="lbImg" alt="" style="max-width:100%;max-height:90vh;border-radius:12px">
</div>

<!-- 最终页 -->
<div id="finale" role="dialog" aria-label="生日快乐">
  <p class="finale-text" id="finaleText"></p>
  <p class="finale-sub" id="finaleSub"></p>
  <div id="clover-notes" aria-hidden="true"></div>
  <button class="btn ghost" id="finaleClose" style="margin-top:var(--sp-6)">返回</button>
</div>

<!-- 背景音乐 -->
<audio id="bgm" loop preload="none">
  <source src="music/birthday.mp3" type="audio/mpeg">
</audio>

<!-- 模糊进入开场覆盖层 -->
<div id="intro-overlay" role="dialog" aria-label="进入网站" aria-modal="true">
  <button id="intro-btn" type="button" aria-label="进入网站">
    <span class="zh">进入网站</span>
    <span class="en">ENTER SITE</span>
  </button>
</div>

<div id="toast" role="status"></div>

<script>
/* CONFIG */
const CONFIG = {
  name: "念姐",
  birthday: "2026-10-12",
  letter: `念姐：\n\n生日快乐！\n\n认识你真好。\n愿你今年所有的愿望都慢慢实现，\n所有的努力都有回响，\n所有的小确幸都能被你接住。\n\n不管以后走到哪里，\n都记得要好好照顾自己，\n也记得有人一直在为你加油。\n\n生日快乐，念姐。\n愿你岁岁年年，都被温柔以待。`,
  finaleText: "生日快乐，念姐！",
  finaleSub: "🌟 愿你岁岁年年，都被温柔以待 🌟",
  photos: [
    {src:"1.jpg", emoji:"✨"},
    {src:"2.jpg", emoji:"🌊"},
    {src:"3.jpg", emoji:"🌸"},
    {src:"4.jpg", emoji:"🌿"}
  ],
  eggs: [
    {ico:"🌹", nm:"一朵玫瑰", msg:"送你一朵永不凋谢的玫瑰 🌹"},
    {ico:"🍰", nm:"一块蛋糕", msg:"啊——喂你一口蛋糕！好吃吗？🍰"},
    {ico:"🎈", nm:"彩色气球", msg:"气球飞走啦，但愿望会留下 🎈"},
    {ico:"⭐", nm:"一颗星星", msg:"你许的愿望，我都听到了 ⭐"},
    {ico:"🧸", nm:"一只小熊", msg:"小熊说：要一直开心哦 🧸"}
  ]
};

/* helpers */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const rand = (a,b) => a + Math.random()*(b-a);
function toast(msg, t=2200){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("show"), t);
}

/* Intro */
(function intro(){
  const overlay = $("#intro-overlay"), btn = $("#intro-btn");
  document.body.classList.add("intro-active");
  btn.addEventListener("click", ()=>{
    document.body.classList.remove("intro-active");
    overlay.classList.add("hide");
    setTimeout(()=>overlay.remove(), 1600);
  });
})();

/* Countdown */
(function countdown(){
  const el = $("#countdown");
  function tick(){
    const now = new Date(), target = new Date(CONFIG.birthday + "T00:00:00");
    let diff = target - now;
    if(diff <= 0){
      el.innerHTML = `<div class="cd-today">🎉 就是今天！生日快乐！</div>`;
      return;
    }
    const d = Math.floor(diff/864e5); diff %= 864e5;
    const h = Math.floor(diff/36e5); diff %= 36e5;
    const m = Math.floor(diff/6e4); const s = Math.floor((diff%6e4)/1000);
    el.innerHTML = `
      <div class="cd-box"><div class="cd-num">${d}</div><div class="cd-lab">天</div></div>
      <div class="cd-box"><div class="cd-num">${h}</div><div class="cd-lab">时</div></div>
      <div class="cd-box"><div class="cd-num">${m}</div><div class="cd-lab">分</div></div>
      <div class="cd-box"><div class="cd-num">${s}</div><div class="cd-lab">秒</div></div>`;
  }
  tick(); setInterval(tick, 1000);
})();

/* Letter */
(function letter(){
  const body = $("#letterBody"); let i=0, typing=false;
  function type(){
    if(i >= CONFIG.letter.length){ typing=false; return; }
    body.textContent = CONFIG.letter.slice(0, ++i);
    body.innerHTML += `<span class="caret"></span>`;
    typing=true;
    setTimeout(type, 40 + Math.random()*30);
  }
  $("#letterStart").addEventListener("click", ()=>{ if(!typing){ i=0; type(); } });
  $("#letterAll").addEventListener("click", ()=>{ i=CONFIG.letter.length; body.textContent=CONFIG.letter; typing=false; });
})();

/* Gallery */
(function gallery(){
  const g = $("#gallery");
  CONFIG.photos.forEach((p, idx)=>{
    const div = document.createElement("div");
    div.className = "ph";
    div.innerHTML = `<img src="${p.src}" alt="照片${idx+1}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="placeholder" style="display:none"><b>${p.emoji||'📷'}</b><span>放入 ${p.src}</span></div>
      <span class="tape">${['🌸','✨','💗','🎀'][idx%4]}</span>`;
    div.addEventListener("click", ()=>{
      const img = div.querySelector("img");
      if(!img.complete || img.naturalWidth===0){ toast("这张照片还没放好哦～"); return; }
      $("#lbImg").src = p.src;
      $("#lightbox").style.display = "flex";
    });
    g.appendChild(div);
  });
  $("#lbClose").addEventListener("click", ()=> $("#lightbox").style.display="none");
  $("#lightbox").addEventListener("click", e=>{ if(e.target===e.currentTarget) e.currentTarget.style.display="none"; });
})();

/* Gift */
(function gift(){
  const g = $("#gift"), rev = $("#giftReveal");
  let open=false;
  g.addEventListener("click", ()=>{
    if(open) return;
    open=true; g.classList.add("open");
    setTimeout(()=>{ rev.textContent="里面是满满的祝福和爱意 💕"; rev.classList.add("show"); }, 500);
  });
})();

/* Game - simplified */
(function game(){
  const cv = $("#gameCanvas"), ctx = cv.getContext("2d");
  let score=0, best=+localStorage.getItem("bbest")||0, running=false, hearts=[], player={x:180,w:60};
  $("#best").textContent = best;
  function resize(){ /* keep fixed for simplicity */ }
  function start(){
    score=0; hearts=[]; running=true; $("#gameOver").classList.remove("show"); $("#score").textContent=0;
    loop();
  }
  function loop(){
    if(!running) return;
    ctx.clearRect(0,0,360,420);
    // player
    ctx.fillStyle="#ff6aa0"; ctx.fillRect(player.x-30,380,60,20);
    // hearts
    if(Math.random()<0.03) hearts.push({x:rand(20,340),y:-20,vy:rand(2,4)});
    hearts = hearts.filter(h=>{
      h.y += h.vy;
      ctx.font="20px serif"; ctx.fillText("💖",h.x,h.y);
      if(h.y>380 && h.y<410 && Math.abs(h.x-player.x)<40){ score++; $("#score").textContent=score; return false; }
      return h.y < 440;
    });
    if(hearts.some(h=>h.y>420)) { // miss
      running=false;
      if(score>best){ best=score; localStorage.setItem("bbest",best); $("#best").textContent=best; }
      $("#finalScore").textContent=score;
      $("#gameOver").classList.add("show");
      return;
    }
    requestAnimationFrame(loop);
  }
  cv.addEventListener("touchmove", e=>{ e.preventDefault(); const t=e.touches[0]; const r=cv.getBoundingClientRect(); player.x = (t.clientX-r.left)*(360/r.width); }, {passive:false});
  cv.addEventListener("mousemove", e=>{ const r=cv.getBoundingClientRect(); player.x = (e.clientX-r.left)*(360/r.width); });
  $("#restart").addEventListener("click", start);
  // auto start on first interaction
  let started=false;
  cv.addEventListener("click", ()=>{ if(!started){ started=true; start(); } });
})();

/* Eggs */
(function eggs(){
  const grid = $("#eggGrid"), cnt = $("#eggCount"); let found=0;
  CONFIG.eggs.forEach(e=>{
    const b = document.createElement("button");
    b.className="egg"; b.innerHTML=`<span class="ico">${e.ico}</span><span class="nm">${e.nm}</span>`;
    b.addEventListener("click", ()=>{
      toast(e.msg);
      if(!b.classList.contains("found")){ b.classList.add("found"); found++; cnt.textContent=found;
        if(found===CONFIG.eggs.length){ setTimeout(()=>toast("🎊 全部彩蛋找到啦！最后的惊喜已解锁"),600); $("#finaleBtn").style.animation="pulse 1s ease-in-out infinite"; }
      }
    });
    grid.appendChild(b);
  });
})();

/* Finale + Clover notes */
(function finale(){
  const el = $("#finale"), txt = $("#finaleText"), sub = $("#finaleSub");
  const notesWrap = $("#clover-notes");
  let started = false;
  const MSGS = ["想见你","谢谢你陪我","生日快乐","要开心哦","一直都在","慢慢来就好","愿你健康","今天也要开心","心里有光","多喝水哦","我支持你","想抱抱你","你很重要","平安喜乐","万事胜意","好好照顾自己","岁岁平安","心想事成","笑口常开","温柔以待","永远快乐","念姐最棒","喜欢你","加油呀","晚安好梦","记得微笑","一切顺利","开心每一天","被爱包围","闪光吧"];
  const COLORS = ["#ffe4ef","#f0e8ff","#e0f2ff","#ddfaf1","#fff9d6","#ffc9de","#d4c2ff","#a9d9ff","#a8eed8","#ffe896","#ffa8c9","#ffd6e8","#e8dfff","#d6f0ff"];
  function cloverPoints(n){
    const pts = [];
    const scale = Math.min(innerWidth, innerHeight) * 0.50;
    for(let i=0;i<Math.floor(n*0.05);i++) pts.push({x:rand(-scale*0.15,scale*0.15),y:rand(-scale*0.15,scale*0.15)});
    const leaves = [
      {cx:0,cy:-scale*1.12,rx:scale*0.60,ry:scale*0.82},
      {cx:scale*1.12,cy:0,rx:scale*0.82,ry:scale*0.60},
      {cx:0,cy:scale*1.12,rx:scale*0.60,ry:scale*0.82},
      {cx:-scale*1.12,cy:0,rx:scale*0.82,ry:scale*0.60}
    ];
    const perLeaf = Math.floor((n-pts.length)/4);
    leaves.forEach(leaf=>{
      for(let i=0;i<perLeaf;i++){
        const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random());
        pts.push({x:leaf.cx+Math.cos(a)*leaf.rx*r, y:leaf.cy+Math.sin(a)*leaf.ry*r});
      }
    });
    while(pts.length<n) pts.push({x:rand(-scale*0.3,scale*0.3),y:rand(-scale*0.3,scale*0.3)});
    return pts;
  }
  function spawnNotes(){
    notesWrap.innerHTML="";
    const count=48, targets=cloverPoints(count);
    for(let i=0;i<count;i++){
      const card=document.createElement("div");
      card.className="note-card";
      card.textContent=MSGS[i%MSGS.length];
      card.style.background=COLORS[i%COLORS.length];
      card.style.setProperty("--tx",targets[i].x+"px");
      card.style.setProperty("--ty",targets[i].y+"px");
      card.style.setProperty("--rot",(rand(-18,18)).toFixed(1)+"deg");
      card.style.animationDelay=(i*0.035)+"s";
      notesWrap.appendChild(card);
      requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add("show")));
    }
  }
  function show(){
    txt.innerHTML="";
    [...CONFIG.finaleText].forEach((ch,i)=>{
      const sp=document.createElement("span");
      sp.className="nm"; sp.textContent=ch;
      sp.style.animationDelay=(i*0.06)+"s";
      if(ch===" ") sp.style.width="0.3em";
      txt.appendChild(sp);
    });
    sub.textContent=CONFIG.finaleSub;
    el.classList.add("show");
    if(!started){ started=true; setTimeout(spawnNotes,400); } else spawnNotes();
  }
  $("#finaleBtn").addEventListener("click", show);
  $("#finaleClose").addEventListener("click", ()=>{ el.classList.remove("show"); notesWrap.innerHTML=""; });
})();

/* Audio */
(function audio(){
  const bgm=$("#bgm"), btn=$("#musicBtn");
  btn.addEventListener("click", ()=>{
    if(bgm.paused){
      bgm.play().then(()=>{ btn.classList.add("playing"); btn.setAttribute("aria-pressed","true"); }).catch(()=>toast("没找到 music/birthday.mp3"));
    }else{ bgm.pause(); btn.classList.remove("playing"); btn.setAttribute("aria-pressed","false"); }
  });
})();
</script>
</body>
</html>
